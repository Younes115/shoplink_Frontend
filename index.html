<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shoplink | MaGi - AeroWeave Minimalist Trench Coat</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
      <div class="brand">
      <img src="logo.png" alt="Shoplink Startup" class="brand__logo" />
      </div>
      </header>

      <main class="product">
        <section class="gallery" aria-label="Product gallery">
          <figure class="gallery__frame">
            <img
              class="gallery__image"
              data-primary-image
              src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=1400&q=80"
              alt="AeroWeave Minimalist Trench Coat front view"
            />
          </figure>

          <div class="gallery__thumbs" aria-label="Thumbnail previews">
            <button
              class="thumb active"
              type="button"
              data-thumb
              data-full="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=1400&q=80"
              data-alt="AeroWeave Minimalist Trench Coat front view"
              aria-label="View front view"
            >
              <img
                src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=280&q=80"
                alt=""
              />
            </button>
            <button
              class="thumb"
              type="button"
              data-thumb
              data-full="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=1400&q=80"
              data-alt="AeroWeave Minimalist Trench Coat angled view"
              aria-label="View angled view"
            >
              <img
                src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=280&q=80"
                alt=""
              />
            </button>
            <button
              class="thumb"
              type="button"
              data-thumb
              data-full="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=1400&q=80"
              data-alt="AeroWeave Minimalist Trench Coat detail view"
              aria-label="View detail view"
            >
              <img
                src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=280&q=80"
                alt=""
              />
            </button>
          </div>
        </section>

        <section class="details" aria-label="Product details">
          <p class="eyebrow">Shoplink / MaGi</p>
          <h1 class="product__title">AeroWeave Minimalist Trench Coat</h1>
          <div class="price">
            <span class="price__current">$189.00 USD</span>
            <span class="price__original">
              <del>$245.00 USD</del>
            </span>
          </div>
          <p class="product__description">
            A tailored, weather-resistant outer layer engineered for modern
            transit. Features an adjustable geometric storm flap, deep internal
            device pockets, and breathable double-knit architecture.
          </p>
          <button class="cta" type="button" data-add-to-cart>
            Add to Cart
          </button>
        </section>
      </main>
    </div>
  </body>
</html>
